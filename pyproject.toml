[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redeye"
version = "0.1.0"
description = "Screenshot and recon web targets into one HTML report — native on Apple Silicon, no Docker or Selenium."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "3uba", email = "75246355+3uba@users.noreply.github.com" }]
keywords = ["pentest", "recon", "screenshot", "eyewitness", "aquatone", "playwright", "arm64"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "playwright>=1.40",
  "httpx>=0.24",
  "jinja2>=3.1",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
redeye = "redeye.cli:main"

[project.urls]
Homepage = "https://github.com/3uba/redeye"
Issues = "https://github.com/3uba/redeye/issues"

[tool.hatch.build.targets.wheel]
packages = ["redeye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
